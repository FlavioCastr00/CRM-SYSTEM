<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="page-header">
            <div>
                <h1>Unknown System</h1>
                <p>Companies</p>
            </div>
            <button id="add-company-button">
                + Add Company
            </button>
        </div>
        <form id="company-filter-form">
            <div class="filter-group">
                <label for="company-name">Company Name:</label>
                <input type="text" id="company-name" name="company-name">
            </div>
            <div class="filter-group">
                <label for="status">Status:</label>
                <select id="status" name="status">
                    <option value="ALL">ALL</option>
                    <option value="NEW">NEW</option>
                    <option value="CONTACTED">CONTACTED</option>
                    <option value="INTERESTED">INTERESTED</option>
                    <option value="NEGOTIATION">NEGOTIATION</option>
                    <option value="ACTIVE">ACTIVE</option>
                </select>
            </div>
            <button type="submit">Search</button>
        </form>
        <div id="table-container">
            <div id="table-div">
                <!-- The companies table shall be generated here -->
            </div>
        </div>
        <!-- Detailed Info Modal -->
        <div id="company-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-company-name"></h2>
                    <button id="modal-close">
                        ×
                    </button>
                </div>
                <div class="modal-navigation">
                    <button
                        class="modal-tab active"
                        data-section="general"
                        onclick="ChangeModalSection('general')">
                        General
                    </button>
                    <button
                        class="modal-tab"
                        data-section="contacts"
                        onclick="ChangeModalSection('contacts')">
                        Contacts
                    </button>
                    <button
                        class="modal-tab"
                        data-section="activities"
                        onclick="ChangeModalSection('activities')">
                        Activities
                    </button>
                </div>
                <div id="modal-body">
                    <!-- Content gets generated here -->
                </div>
            </div>
        </div>
        <!-- Add Company Form Modal -->
         <div id="add-company-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add Company</h2>
                    <button id="add-company-close">
                        ×
                    </button>
                </div>
                <div class="modal-body">
                    <form id="company-form">
                        <div class="form-group full-width">
                            <label for="new-company-name">
                                Company Name
                            </label>
                            <input
                                type="text"
                                id="new-company-name"
                                name="name"
                                required
                            >
                        </div>
                        <div class="form-group">
                            <label for="category">
                                Category
                            </label>
                            <select
                                id="category"
                                name="categoryID"
                                required>
                                <!-- Categories Shall Be Generated Here -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="neighborhood">
                                Neighborhood
                            </label>
                            <input
                                type="text"
                                id="neighborhood"
                                name="neighborhood"
                                required
                            >
                        </div>
                        <div class="form-group full-width">
                            <label for="address">
                                Address
                            </label>
                            <input
                                type="text"
                                id="address"
                                name="address"
                                required
                            >
                        </div>
                        <div class="form-group">
                            <label for="email">
                                Email
                            </label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                            >
                        </div>
                        <div class="form-group">
                            <label for="phone">
                                Phone
                            </label>
                            <input
                                type="text"
                                id="phone"
                                name="phone"
                            >
                        </div>
                        <div class="form-group full-width">
                            <label for="website">
                                Website
                            </label>
                            <input
                                type="text"
                                id="website"
                                name="website"
                            >
                        </div>
                        <div class="form-actions">
                            <button
                                type="button"
                                id="add-company-cancel">
                                Cancel
                            </button>
                            <button type="submit">
                                Add Company
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script src="js/company-form.js"></script>
        <script src="js/companies.js"></script>
        <script src="js/contacts.js"></script>
        <script src="js/activities.js"></script>
        <script src="js/modal.js"></script>
        <script src="js/script.js" defer></script>
    </body>
</html>
